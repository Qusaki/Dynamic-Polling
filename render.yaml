services:
  - type: web
    name: dynamic-polling-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && chmod +x build.sh && ./build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.9.0

