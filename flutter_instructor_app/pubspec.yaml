name: flutter_instructor_app
description: A new Flutter project.
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core
  cupertino_icons: ^1.0.2
  go_router: ^12.1.1
  flutter_riverpod: ^2.4.9
  hooks_riverpod: ^2.4.9

  # UI & Animation
  flutter_animate: ^4.5.0
  fl_chart: ^0.65.0
  qr_flutter: ^4.1.0

